services:
  cass1:
    image: cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=anti-interrupt
      - CASSANDRA_SEEDS=cass1
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    ports: ["9042:9042"]

  cass2:
    image: cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=anti-interrupt
      - CASSANDRA_SEEDS=cass1
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    depends_on: [cass1]
    ports: ["9043:9042"]

  cass3:
    image: cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=anti-interrupt
      - CASSANDRA_SEEDS=cass1
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    depends_on: [cass1]
    ports: ["9044:9042"]
